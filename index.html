<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Email Signatures</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: "Segoe UI", Arial, sans-serif;
        background: #f4f6f9;
        color: #222;
        min-height: 100vh;
      }
      header {
        background: #019ee3;
        color: #fff;
        padding: 18px 32px;
        font-size: 20px;
        font-weight: 600;
        letter-spacing: 0.3px;
      }
      .breadcrumb {
        padding: 12px 32px;
        font-size: 13px;
        color: #666;
        background: #fff;
        border-bottom: 1px solid #e0e0e0;
      }
      .breadcrumb a {
        color: #019ee3;
        text-decoration: none;
        cursor: pointer;
      }
      .breadcrumb a:hover {
        text-decoration: underline;
      }
      .container {
        padding: 28px 32px;
      }
      .companies-grid,
      .sig-grid {
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
      }
      .company-card,
      .sig-card {
        background: #fff;
        border: 1px solid #e0e0e0;
        border-radius: 10px;
        cursor: pointer;
        transition:
          box-shadow 0.18s,
          border-color 0.18s;
      }
      .company-card {
        width: 260px;
        padding: 28px 32px;
      }
      .sig-card {
        width: 240px;
        padding: 16px 20px;
      }
      .company-card:hover,
      .sig-card:hover {
        box-shadow: 0 4px 18px rgba(1, 158, 227, 0.15);
        border-color: #019ee3;
      }
      .company-icon {
        font-size: 36px;
        margin-bottom: 12px;
      }
      .company-name {
        font-size: 16px;
        font-weight: 700;
        color: #111;
        margin-bottom: 4px;
      }
      .company-count {
        font-size: 13px;
        color: #888;
      }
      .sig-header {
        margin-bottom: 20px;
      }
      .sig-header h2 {
        font-size: 18px;
        font-weight: 700;
        color: #111;
      }
      .sig-avatar {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        background: #e8f6fd;
        color: #019ee3;
        font-size: 16px;
        font-weight: 700;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 10px;
      }
      .sig-name {
        font-size: 14px;
        font-weight: 700;
        color: #111;
        margin-bottom: 3px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .sig-pos {
        font-size: 12px;
        color: #666;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .sig-email {
        font-size: 11px;
        color: #aaa;
        margin-top: 4px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .viewer-toolbar {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 20px;
      }
      .viewer-toolbar h2 {
        font-size: 16px;
        font-weight: 700;
        color: #111;
      }
      .btn-back,
      .btn-fs-close {
        background: none;
        border: 1px solid #ccc;
        border-radius: 6px;
        padding: 6px 14px;
        font-size: 13px;
        cursor: pointer;
        color: #444;
      }
      .btn-fullscreen {
        margin-left: auto;
        background: #019ee3;
        color: #fff;
        border: none;
        border-radius: 6px;
        padding: 6px 14px;
        font-size: 13px;
        cursor: pointer;
      }
      .sig-iframe-wrap {
        background: #fff;
        border: 1px solid #e0e0e0;
        border-radius: 10px;
        padding: 32px;
        overflow: auto;
      }
      iframe {
        width: 100%;
        border: none;
        min-height: 520px;
        display: block;
      }
      .section {
        display: none;
      }
      .section.active {
        display: block;
      }
      .fs-overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: #fff;
        z-index: 9999;
        flex-direction: column;
      }
      .fs-overlay.open {
        display: flex;
      }
      .fs-toolbar {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px 20px;
        background: #f4f6f9;
        border-bottom: 1px solid #e0e0e0;
      }
      .fs-toolbar span {
        flex: 1;
        font-size: 14px;
        font-weight: 600;
        color: #333;
      }
      .fs-body {
        flex: 1;
        overflow: auto;
        padding: 32px;
        display: flex;
        align-items: flex-start;
        justify-content: center;
      }
      .fs-body iframe {
        width: 100%;
        max-width: 760px;
        min-height: 600px;
      }
    </style>
  </head>
  <body>
    <header>Email Signatures</header>
    <div class="breadcrumb" id="breadcrumb"><span>Home</span></div>

    <div class="container">
      <div class="section active" id="section-home">
        <div class="companies-grid" id="companies-grid"></div>
      </div>
      <div class="section" id="section-company">
        <div class="sig-header"><h2 id="company-title"></h2></div>
        <div class="sig-grid" id="sig-grid"></div>
      </div>
      <div class="section" id="section-viewer">
        <div class="viewer-toolbar">
          <button class="btn-back" id="btn-back-to-company">? Back</button>
          <h2 id="viewer-title"></h2>
          <button class="btn-fullscreen" id="btn-fullscreen">
            ? Full Screen
          </button>
        </div>
        <div class="sig-iframe-wrap">
          <iframe
            id="sig-iframe"
            src=""
            title="Email Signature Preview"
          ></iframe>
        </div>
      </div>
    </div>

    <div class="fs-overlay" id="fs-overlay">
      <div class="fs-toolbar">
        <span id="fs-title"></span
        ><button class="btn-fs-close" id="btn-fs-close">? Close</button>
      </div>
      <div class="fs-body">
        <iframe
          id="fs-iframe"
          src=""
          title="Email Signature Fullscreen"
        ></iframe>
      </div>
    </div>

      ];

      let currentCompany = null;
      const initials = (name) =>
        name
          .split(" ")
          .slice(0, 2)
          .map((w) => w[0]?.toUpperCase() || "")
          .join("");
      const showSection = (id) => {
        document
          .querySelectorAll(".section")
          .forEach((s) => s.classList.remove("active"));
        document.getElementById(id).classList.add("active");
      };
      const setBreadcrumb = (html) => {
        document.getElementById("breadcrumb").innerHTML = html;
      };
      const getSignatureUrl = (company, sig) => `${company.id}/${sig.file}`;
      const openSignatureInNewTab = (company, sig) => {
        window.open(getSignatureUrl(company, sig), "_blank", "noopener");
      };

      function renderHome() {
        const grid = document.getElementById("companies-grid");
        grid.innerHTML = "";
        companies.forEach((company) => {
          const card = document.createElement("div");
          card.className = "company-card";
          card.innerHTML = `<div class="company-icon">${company.icon}</div><div class="company-name">${company.name}</div><div class="company-count">${company.signatures.length} signatures</div>`;
          card.addEventListener("click", () => renderCompany(company));
          grid.appendChild(card);
        });
        setBreadcrumb("<span>Home</span>");
        showSection("section-home");
      }

      function renderCompany(company) {
        currentCompany = company;
        document.getElementById("company-title").textContent = company.name;
        const grid = document.getElementById("sig-grid");
        grid.innerHTML = "";
        company.signatures.forEach((sig) => {
          const card = document.createElement("div");
          card.className = "sig-card";
          card.innerHTML = `<div class="sig-avatar">${initials(sig.name)}</div><div class="sig-name">${sig.name}</div><div class="sig-pos">${sig.position}</div><div class="sig-email">${sig.email}</div>`;
          card.addEventListener("click", () =>
            openSignatureInNewTab(company, sig),
          );
          grid.appendChild(card);
        });
        setBreadcrumb(
          `<a onclick="renderHome()">Home</a> / <span>${company.name}</span>`,
        );
        showSection("section-company");
      }

      function renderViewer(company, sig) {
        document.getElementById("viewer-title").textContent = sig.name;
        document.getElementById("sig-iframe").src = getSignatureUrl(
          company,
          sig,
        );
        document.getElementById("btn-back-to-company").onclick = () =>
          renderCompany(company);
        document.getElementById("btn-fullscreen").onclick = () =>
          openSignatureInNewTab(company, sig);
        setBreadcrumb(
          `<a onclick="renderHome()">Home</a> / <a onclick="renderCompany(currentCompany)">${company.name}</a> / <span>${sig.name}</span>`,
        );
        showSection("section-viewer");
      }

      function openFullscreen(company, sig) {
        openSignatureInNewTab(company, sig);
      }

      document.getElementById("btn-fs-close").addEventListener("click", () => {
        document.getElementById("fs-overlay").classList.remove("open");
        document.getElementById("fs-iframe").src = "";
        document.body.style.overflow = "";
      });

      document
        .getElementById("sig-iframe")
        .addEventListener("load", function () {
          try {
            const h = this.contentDocument.body.scrollHeight;
            if (h > 100) this.style.height = h + 40 + "px";
          } catch (e) {}
        });
      document
        .getElementById("fs-iframe")
        .addEventListener("load", function () {
          try {
            const h = this.contentDocument.body.scrollHeight;
            if (h > 100) this.style.height = h + 40 + "px";
          } catch (e) {}
        });

      renderHome();

  </body>
</html>
