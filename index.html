<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Email Signatures</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: "Segoe UI", Arial, sans-serif;
        background: #f4f6f9;
        color: #222;
        min-height: 100vh;
      }
      header {
        background: #019ee3;
        color: #fff;
        padding: 18px 32px;
        font-size: 20px;
        font-weight: 600;
        letter-spacing: 0.3px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .generator-button {
        background: #fff;
        border: 0;
        border-radius: 6px;
        color: #017db4;
        cursor: pointer;
        font-size: 13px;
        font-weight: 700;
        padding: 9px 13px;
      }
      .breadcrumb {
        padding: 12px 32px;
        font-size: 13px;
        color: #666;
        background: #fff;
        border-bottom: 1px solid #e0e0e0;
      }
      .breadcrumb a {
        color: #019ee3;
        text-decoration: none;
        cursor: pointer;
      }
      .breadcrumb a:hover {
        text-decoration: underline;
      }
      .container {
        padding: 28px 32px;
      }
      .companies-grid,
      .sig-grid {
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
      }
      .company-card,
      .sig-card {
        background: #fff;
        border: 1px solid #e0e0e0;
        border-radius: 10px;
        cursor: pointer;
        transition:
          box-shadow 0.18s,
          border-color 0.18s;
      }
      .company-card {
        width: 260px;
        padding: 28px 32px;
      }
      .sig-card {
        width: 240px;
        padding: 16px 20px;
      }
      .sig-card-actions {
        display: flex;
        justify-content: flex-end;
        margin-top: 12px;
      }
      .delete-signature {
        border: 1px solid #d92d20;
        border-radius: 5px;
        background: #fff;
        color: #b42318;
        cursor: pointer;
        font: inherit;
        font-size: 12px;
        padding: 5px 9px;
      }
      .delete-signature:hover {
        background: #fff1f0;
      }
      .company-card:hover,
      .sig-card:hover {
        box-shadow: 0 4px 18px rgba(1, 158, 227, 0.15);
        border-color: #019ee3;
      }
      .company-icon {
        font-size: 36px;
        margin-bottom: 12px;
      }
      .company-name {
        font-size: 16px;
        font-weight: 700;
        color: #111;
        margin-bottom: 4px;
      }
      .company-count {
        font-size: 13px;
        color: #888;
      }
      .sig-header {
        margin-bottom: 20px;
      }
      .sig-header h2 {
        font-size: 18px;
        font-weight: 700;
        color: #111;
      }
      .sig-avatar {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        background: #e8f6fd;
        color: #019ee3;
        font-size: 16px;
        font-weight: 700;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 10px;
      }
      .sig-name {
        font-size: 14px;
        font-weight: 700;
        color: #111;
        margin-bottom: 3px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .sig-pos {
        font-size: 12px;
        color: #666;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .sig-email {
        font-size: 11px;
        color: #aaa;
        margin-top: 4px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .viewer-toolbar {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 20px;
      }
      .viewer-toolbar h2 {
        font-size: 16px;
        font-weight: 700;
        color: #111;
      }
      .btn-back,
      .btn-fs-close {
        background: none;
        border: 1px solid #ccc;
        border-radius: 6px;
        padding: 6px 14px;
        font-size: 13px;
        cursor: pointer;
        color: #444;
      }
      .btn-fullscreen {
        margin-left: auto;
        background: #019ee3;
        color: #fff;
        border: none;
        border-radius: 6px;
        padding: 6px 14px;
        font-size: 13px;
        cursor: pointer;
      }
      .sig-iframe-wrap {
        background: #fff;
        border: 1px solid #e0e0e0;
        border-radius: 10px;
        padding: 32px;
        overflow: auto;
      }
      iframe {
        width: 100%;
        border: none;
        min-height: 520px;
        display: block;
      }
      .section {
        display: none;
      }
      .section.active {
        display: block;
      }
      .fs-overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: #fff;
        z-index: 9999;
        flex-direction: column;
      }
      .fs-overlay.open {
        display: flex;
      }
      .fs-toolbar {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px 20px;
        background: #f4f6f9;
        border-bottom: 1px solid #e0e0e0;
      }
      .fs-toolbar span {
        flex: 1;
        font-size: 14px;
        font-weight: 600;
        color: #333;
      }
      .fs-body {
        flex: 1;
        overflow: auto;
        padding: 32px;
        display: flex;
        align-items: flex-start;
        justify-content: center;
      }
      .fs-body iframe {
        width: 100%;
        max-width: 760px;
        min-height: 600px;
      }
      .generator-overlay {
        align-items: center;
        background: rgba(0, 0, 0, 0.45);
        display: none;
        inset: 0;
        justify-content: center;
        padding: 20px;
        position: fixed;
        z-index: 10000;
      }
      .generator-overlay.open {
        display: flex;
      }
      .generator-dialog {
        background: #fff;
        border-radius: 12px;
        box-shadow: 0 12px 38px rgba(0, 0, 0, 0.2);
        max-width: 440px;
        padding: 24px;
        width: 100%;
      }
      .generator-dialog h2 {
        font-size: 19px;
        margin-bottom: 8px;
      }
      .generator-dialog p {
        color: #666;
        font-size: 13px;
        line-height: 1.45;
        margin-bottom: 18px;
      }
      .generator-field {
        display: block;
        font-size: 13px;
        font-weight: 700;
        margin-bottom: 14px;
      }
      .generator-field input,
      .generator-field select {
        border: 1px solid #cbd3da;
        border-radius: 6px;
        display: block;
        font: inherit;
        margin-top: 6px;
        padding: 9px 10px;
        width: 100%;
      }
      .generator-actions {
        display: flex;
        gap: 10px;
        justify-content: flex-end;
        margin-top: 20px;
      }
      .generator-actions button {
        border: 0;
        border-radius: 6px;
        cursor: pointer;
        font-size: 13px;
        font-weight: 700;
        padding: 9px 13px;
      }
      #generator-cancel {
        background: #edf1f4;
        color: #444;
      }
      #generator-submit {
        background: #019ee3;
        color: #fff;
      }
      .generator-error {
        color: #bb1b1b;
        display: none;
        font-size: 12px;
        line-height: 1.4;
        margin-top: 12px;
      }
      .generator-error.show {
        display: block;
      }
    </style>
  </head>
  <body>
    <header>
      <span>Email Signatures</span>
      <button class="generator-button" id="open-generator" type="button">
        Signature Generator
      </button>
    </header>
    <div class="breadcrumb" id="breadcrumb"><span>Home</span></div>

    <div class="container">
      <div class="section active" id="section-home">
        <div class="companies-grid" id="companies-grid"></div>
      </div>
      <div class="section" id="section-company">
        <div class="sig-header"><h2 id="company-title"></h2></div>
        <div class="sig-grid" id="sig-grid"></div>
      </div>
      <div class="section" id="section-viewer">
        <div class="viewer-toolbar">
          <button class="btn-back" id="btn-back-to-company">? Back</button>
          <h2 id="viewer-title"></h2>
          <button class="btn-fullscreen" id="btn-fullscreen">
            ? Full Screen
          </button>
        </div>
        <div class="sig-iframe-wrap">
          <iframe
            id="sig-iframe"
            src=""
            title="Email Signature Preview"
          ></iframe>
        </div>
      </div>
    </div>

    <div class="fs-overlay" id="fs-overlay">
      <div class="fs-toolbar">
        <span id="fs-title"></span
        ><button class="btn-fs-close" id="btn-fs-close">? Close</button>
      </div>
      <div class="fs-body">
        <iframe
          id="fs-iframe"
          src=""
          title="Email Signature Fullscreen"
        ></iframe>
      </div>
    </div>

    <div class="generator-overlay" id="generator-overlay" aria-hidden="true">
      <form class="generator-dialog" id="generator-form">
        <h2>Signature Generator</h2>
        <p>
          Create a signature from the correct company and location template.
          It will be saved in this browser's signature list.
        </p>
        <label class="generator-field">
          Company / location
          <select id="generator-template" required>
            <option value="ghothane">Ghothane Lawyers</option>
            <option value="twgg-australia">TWGG Australia</option>
            <option value="twgg-kathmandu">TWGG Kathmandu</option>
            <option value="twgg-pokhara">TWGG Pokhara</option>
          </select>
        </label>
        <label class="generator-field">
          Full name
          <input id="generator-name" required autocomplete="name" />
        </label>
        <label class="generator-field">
          Email
          <input id="generator-email" type="email" required autocomplete="email" />
        </label>
        <label class="generator-field">
          Phone
          <input id="generator-phone" required autocomplete="tel" />
        </label>
        <div class="generator-error" id="generator-error"></div>
        <div class="generator-actions">
          <button id="generator-cancel" type="button">Cancel</button>
          <button id="generator-submit" type="submit">Generate signature</button>
        </div>
      </form>
    </div>

            },
          ],
        },
      ];

      let currentCompany = null;
      const generatedStorageKey = "email-signatures-generated-v1";
      const generatorTemplates = {
        ghothane: {
          companyId: "ghothane-lawyers",
          file: "ghothane-lawyers/new-employee-template.html",
          label: "Ghothane Lawyers",
        },
        "twgg-australia": {
          companyId: "twgg",
          file: "twgg/new-employee-australia-template.html",
          label: "TWGG Australia",
        },
        "twgg-kathmandu": {
          companyId: "twgg",
          file: "twgg/new-employee-kathmandu-template.html",
          label: "TWGG Kathmandu",
        },
        "twgg-pokhara": {
          companyId: "twgg",
          file: "twgg/new-employee-pokhara-template.html",
          label: "TWGG Pokhara",
        },
      };
      const escapeHtml = (value) =>
        value.replace(/[&<>"']/g, (char) =>
          ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[char],
        );
      const loadGeneratedSignatures = () => {
        try {
          const data = JSON.parse(localStorage.getItem(generatedStorageKey) || "[]");
          return Array.isArray(data) ? data : [];
        } catch {
          return [];
        }
      };
      const saveGeneratedSignatures = (signatures) =>
        localStorage.setItem(generatedStorageKey, JSON.stringify(signatures));
      const removeKathmanduPostOfficeFromGeneratedSignatures = () => {
        const signatures = loadGeneratedSignatures();
        let changed = false;
        const updated = signatures.map((signature) => {
          if (
            !signature.position?.includes("Kathmandu") ||
            !signature.html?.includes("+977 9709 169 057")
          ) {
            return signature;
          }
          const html = signature.html.replace(
            /<tr><td[^>]*><img[^>]*post-mail-box[^>]*><\/td><td[^>]*>\+977 9709 169 057<\/td><\/tr>\s*/i,
            "",
          );
          if (html !== signature.html) changed = true;
          return { ...signature, html };
        });
        if (changed) saveGeneratedSignatures(updated);
      };
      const deleteGeneratedSignature = (id) => {
        const signature = loadGeneratedSignatures().find((item) => item.id === id);
        if (!signature) return;
        if (!window.confirm(`Delete the generated signature for ${signature.name}?`)) return;
        saveGeneratedSignatures(
          loadGeneratedSignatures().filter((item) => item.id !== id),
        );
        if (currentCompany) renderCompany(currentCompany);
      };
      const signaturesFor = (company) => [
        ...company.signatures,
        ...loadGeneratedSignatures().filter((sig) => sig.companyId === company.id),
      ];
      const initials = (name) =>
        name
          .split(" ")
          .slice(0, 2)
          .map((w) => w[0]?.toUpperCase() || "")
          .join("");
      const showSection = (id) => {
        document
          .querySelectorAll(".section")
          .forEach((s) => s.classList.remove("active"));
        document.getElementById(id).classList.add("active");
      };
      const setBreadcrumb = (html) => {
        document.getElementById("breadcrumb").innerHTML = html;
      };
      const getSignatureUrl = (company, sig) => `${company.id}/${sig.file}`;
      const getGeneratedSignatureUrl = (sig) => {
        const url = new URL("generated-signature.html", window.location.href);
        url.searchParams.set("generated", sig.id);
        return url.toString();
      };
      const openSignatureInNewTab = (company, sig) => {
        if (sig.generated) {
          window.open(getGeneratedSignatureUrl(sig), "_blank", "noopener");
          return;
        }
        window.open(getSignatureUrl(company, sig), "_blank", "noopener");
      };

      function renderHome() {
        const grid = document.getElementById("companies-grid");
        grid.innerHTML = "";
        companies.forEach((company) => {
          const card = document.createElement("div");
          card.className = "company-card";
          card.innerHTML = `<div class="company-icon">${company.icon}</div><div class="company-name">${company.name}</div><div class="company-count">${signaturesFor(company).length} signatures</div>`;
          card.addEventListener("click", () => renderCompany(company));
          grid.appendChild(card);
        });
        setBreadcrumb("<span>Home</span>");
        showSection("section-home");
      }

      function renderCompany(company) {
        currentCompany = company;
        document.getElementById("company-title").textContent = company.name;
        const grid = document.getElementById("sig-grid");
        grid.innerHTML = "";
        signaturesFor(company).forEach((sig) => {
          const card = document.createElement("div");
          card.className = "sig-card";
          card.innerHTML = `<div class="sig-avatar">${initials(sig.name)}</div><div class="sig-name">${escapeHtml(sig.name)}</div><div class="sig-pos">${escapeHtml(sig.position)}</div><div class="sig-email">${escapeHtml(sig.email)}</div>${sig.generated ? '<div class="sig-card-actions"><button class="delete-signature" type="button">Delete</button></div>' : ""}`;
          card.addEventListener("click", () =>
            openSignatureInNewTab(company, sig),
          );
          if (sig.generated) {
            card.querySelector(".delete-signature").addEventListener("click", (event) => {
              event.stopPropagation();
              deleteGeneratedSignature(sig.id);
            });
          }
          grid.appendChild(card);
        });
        setBreadcrumb(
          `<a onclick="renderHome()">Home</a> / <span>${company.name}</span>`,
        );
        showSection("section-company");
      }

      function renderViewer(company, sig) {
        document.getElementById("viewer-title").textContent = sig.name;
        document.getElementById("sig-iframe").src = getSignatureUrl(
          company,
          sig,
        );
        document.getElementById("btn-back-to-company").onclick = () =>
          renderCompany(company);
        document.getElementById("btn-fullscreen").onclick = () =>
          openSignatureInNewTab(company, sig);
        setBreadcrumb(
          `<a onclick="renderHome()">Home</a> / <a onclick="renderCompany(currentCompany)">${company.name}</a> / <span>${sig.name}</span>`,
        );
        showSection("section-viewer");
      }

      function openFullscreen(company, sig) {
        openSignatureInNewTab(company, sig);
      }

      document.getElementById("btn-fs-close").addEventListener("click", () => {
        document.getElementById("fs-overlay").classList.remove("open");
        document.getElementById("fs-iframe").src = "";
        document.body.style.overflow = "";
      });

      document
        .getElementById("sig-iframe")
        .addEventListener("load", function () {
          try {
            const h = this.contentDocument.body.scrollHeight;
            if (h > 100) this.style.height = h + 40 + "px";
          } catch (e) {}
        });
      document
        .getElementById("fs-iframe")
        .addEventListener("load", function () {
          try {
            const h = this.contentDocument.body.scrollHeight;
            if (h > 100) this.style.height = h + 40 + "px";
          } catch (e) {}
        });

      const generatorOverlay = document.getElementById("generator-overlay");
      const generatorError = document.getElementById("generator-error");
      const closeGenerator = () => {
        generatorOverlay.classList.remove("open");
        generatorOverlay.setAttribute("aria-hidden", "true");
        generatorError.classList.remove("show");
        generatorError.textContent = "";
      };
      document.getElementById("open-generator").addEventListener("click", () => {
        generatorOverlay.classList.add("open");
        generatorOverlay.setAttribute("aria-hidden", "false");
        document.getElementById("generator-name").focus();
      });
      document.getElementById("generator-cancel").addEventListener("click", closeGenerator);
      generatorOverlay.addEventListener("click", (event) => {
        if (event.target === generatorOverlay) closeGenerator();
      });
      document.getElementById("generator-form").addEventListener("submit", async (event) => {
        event.preventDefault();
        const type = document.getElementById("generator-template").value;
        const definition = generatorTemplates[type];
        const name = document.getElementById("generator-name").value.trim();
        const email = document.getElementById("generator-email").value.trim();
        const phone = document.getElementById("generator-phone").value.trim();
        if (!definition || !name || !email || !phone) return;
        try {
          const response = await fetch(definition.file);
          if (!response.ok) throw new Error("Template could not be loaded.");
          const phoneDigits = phone.replace(/[^+\d]/g, "");
          const html = (await response.text())
            .replaceAll("{{FULL_NAME}}", escapeHtml(name))
            .replaceAll("{{EMAIL}}", escapeHtml(email))
            .replaceAll("{{PHONE_DISPLAY}}", escapeHtml(phone))
            .replaceAll("{{PHONE_DIGITS}}", escapeHtml(phoneDigits));
          const generated = loadGeneratedSignatures();
          generated.push({
            id: `${Date.now()}-${Math.random().toString(36).slice(2)}`,
            companyId: definition.companyId,
            name,
            email,
            position: `Generated — ${definition.label}`,
            generated: true,
            html,
          });
          saveGeneratedSignatures(generated);
          document.getElementById("generator-form").reset();
          closeGenerator();
          const company = companies.find((item) => item.id === definition.companyId);
          renderCompany(company);
        } catch (error) {
          generatorError.textContent =
            "The template could not be loaded. Open this site through its hosted web address and try again.";
          generatorError.classList.add("show");
        }
      });

      removeKathmanduPostOfficeFromGeneratedSignatures();
      renderHome();
    </script>
  </body>
</html>
